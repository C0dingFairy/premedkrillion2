const T=25,G=10,MAXD=7000,$=document.getElementById("app"),root=document.documentElement,$i=id=>document.getElementById(id);

const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const x=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=x}}return m[b.length]}

 for(const e of A)for(const k of ks(e)){const tol=k.length>=9?2:k.length>=5?1:0;if(tol&&Math.abs(k.length-n.length)<=tol&&lev(n,k)<=tol)return e}

 const mx=X(Math.min(pts,700)),area=`${path}L${X(700)} 170 L${X(0)} 170Z`;
 const bell=`<svg class="ch" viewBox="0 0 700 200"><defs><clipPath id="cp"><rect x="0" y="0" width="${mx}" height="200"/></clipPath></defs><path d="${area}" fill="#3fd0f0" opacity=".18"/><path d="${area}" fill="#3fd0f0" opacity=".5" clip-path="url(#cp)"/><path d="${path}" fill="none" stroke="#3fd0f0" stroke-width="2"/><line x1="${mx}" y1="40" x2="${mx}" y2="170" stroke="#ff5d73" stroke-width="2"/><circle cx="${mx}" cy="40" r="4" fill="#ff5d73"/><text x="${mx}" y="30" text-anchor="middle" fill="#ff5d73" font-size="12" font-weight="700">YOU</text>${[0,100,200,300,400,500,600,700].map(v=>`<text x="${X(v)}" y="190" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">${v}</text>`).join("")}</svg>`;
 const cols=log.map((x,i)=>{const cx=75+i*93,g=x.p*G;return `<line x1="${cx}" y1="${Y(0)}" x2="${cx}" y2="${Y(g)}" stroke="currentColor" opacity=".45" stroke-width="2"/><text x="${cx}" y="18" text-anchor="middle" font-size="11" fill="currentColor">${i+1}</text><text x="${cx}" y="${Y(g)+16}" text-anchor="middle" font-size="16">${rar(x.p)[0]}</text>`}).join("");
 const grid=[0,250,500,750,1000].map(m=>`<line x1="40" x2="690" y1="${Y(m)}" y2="${Y(m)}" stroke="currentColor" stroke-dasharray="3 4" opacity=".25"/><text x="36" y="${Y(m)+3}" text-anchor="end" font-size="9" fill="currentColor" opacity=".7">-${m}m</text>`).join("");
 const best=R.map((x,i)=>{const tp=[...x.a].sort((a,b)=>b[1]-a[1])[0],hit=log[i]&&log[i].a===tp[0];return `<li><span>${i+1}. ${tp[0]}<br><small>${x.q}</small></span><b>${hit?"✓ ":""}-${fmt(tp[1]*G)} m</b></li>`}).join("");
 $.innerHTML=`<div class="card c"><h3>YOUR DIVE</h3><div class="big">${pts}</div><div class="gain" style="color:var(--ac)">-${fmt(d)} m</div><div class="rar"><div class="n">${rank}</div></div></div>
 <div class="card"><h3>HOW YOU COMPARE</h3>${bell}<div class="mu c">Better than ${pc}% of typical dives (estimated)</div></div>
 <div class="card"><h3>DIVE LOG · DEEPER = RARER</h3><svg class="ch" viewBox="0 0 700 250">${grid}${cols}</svg><ul style="margin-top:8px">${log.map((x,i)=>`<li><span>${i+1}. ${x.a}<br><small>${x.q} · ${rar(x.p)[1]}</small></span><b>+${fmt(x.p*G)} m</b></li>`).join("")}</ul></div>
 <div class="card"><h3>DEEPEST ANSWERS OF THE DAY</h3><ul>${best}</ul></div><button id="again">Dive again</button>`;
 $i("again").onclick=()=>{animateTo(0,1500,()=>{r=0;pts=0;log=[];intro()})};window.scrollTo(0,0)}
intro();

</script></body></html>
